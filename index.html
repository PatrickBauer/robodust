<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RoboDust</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1a1a1a; --muted: #6b6b68; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141414; --fg: #f0f0ee; --muted: #9a9a96; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
         background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 32rem; }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 .5rem; font-weight: 600; }
  p { margin: 0; color: var(--muted); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>RoboDust is a robot vacuum for your Mac desktop.</h1>
  <p>Coming soon, from <a href="https://muhraufan.com">Muhammad Raufan Yusup</a>.</p>
</main>
</body>
</html>
