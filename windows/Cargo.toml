[package]
name = "robodust"
version = "0.1.0"
edition = "2024"
description = "A robot vacuum for your Windows desktop"
license = "MIT"

[dependencies]
ab_glyph = "0.2.32"
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
egui = { version = "0.37.0", features = ["default_fonts", "monochrome_emoji_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
pollster = "1.0.1"
raw-window-handle = "0.6"
wgpu = "30.0.1"
winit = "0.30.13"

[profile.release]
lto = "thin"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_System_Variant", "Win32_Storage_FileSystem", "Win32_UI_Shell_PropertiesSystem", "Win32_System_SystemServices", "Win32_UI_HiDpi", "Win32_System_Com_StructuredStorage", "Win32_UI_Controls"] }
