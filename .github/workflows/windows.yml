name: Windows

# Builds the Windows port. Pushing a tag like windows-v0.1.0 also publishes it as a GitHub release.
on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
    tags: ["windows-v*"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW and the Rust target
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - name: Collect
        run: |
          mkdir -p ../dist
          cp target/x86_64-pc-windows-gnu/release/robodust.exe ../dist/RoboDust-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: RoboDust-Windows
          path: dist/RoboDust-Windows.exe
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/RoboDust-Windows.exe \
            --title "RoboDust for Windows ${TAG#windows-v}" \
            --notes "RoboDust for Windows 10 and 11 (64-bit). Download RoboDust-Windows.exe and run it; there's nothing to install. It isn't signed, so Windows SmartScreen asks first: click More info, then Run anyway." \
            --latest
